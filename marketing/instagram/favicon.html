<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>E9 Soluções — favicon</title>
<style>
/* =========================================================
   Favicon · marca E9 em disco, derivado da variante
   "platina-marca" da foto de perfil (perfil.html #b).
   Difere de propósito da arte do Instagram:
   - recorte circular real (o favicon aparece em quadrado)
   - marca maior (~62% do diâmetro) para ler a 16px
   - sem lattice: a malha vira ruído nesse tamanho
   Renderizado a 1024 e reamostrado pelo export-favicon.js.
   ========================================================= */
:root{
  --e9-blue-950:#001838; --e9-blue-800:#003A85; --e9-blue-600:#005BD1;
  --e9-platinum:#E5E9F2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:transparent}

.icon{position:relative;width:1024px;height:1024px;border-radius:50%;overflow:hidden;
  display:flex;align-items:center;justify-content:center;isolation:isolate;
  background:radial-gradient(circle at 50% 34%,var(--e9-blue-600) 0%,var(--e9-blue-800) 52%,var(--e9-blue-950) 100%)}

/* aro interno: separa o disco de abas claras sem virar borda desenhada */
.icon::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  box-shadow:inset 0 0 0 8px rgba(255,255,255,.10)}

.mark{position:relative;width:592px;height:592px;z-index:2;
  filter:drop-shadow(0 8px 26px rgba(0,24,56,.45))}
.mark svg{display:block;width:100%;height:100%}
</style>
</head>
