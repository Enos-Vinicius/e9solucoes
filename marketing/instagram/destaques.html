<title>E9 Soluções — capas de destaque</title>
<style>
/* =========================================================
   Capas de destaque (highlights) · 1080x1920
   Mesma pegada da foto de perfil "platina-marca": o fundo é a
   escada da marca (600 → 800 → 950) e o traço é platina.

   O Instagram recorta a capa em círculo no centro da imagem,
   então TUDO aqui é radialmente simétrico em torno do centro —
   o gradiente, a malha e o ícone. Assim qualquer variação no
   recorte continua enquadrada.

   Os ícones seguem o mesmo desenho dos posts: grid de 24,
   traço sem preenchimento, cantos arredondados. Não usamos
   biblioteca de ícone: o export roda offline.
   ========================================================= */
:root{
  --e9-blue-950:#001838; --e9-blue-800:#003A85; --e9-blue-600:#005BD1;
  --e9-platinum:#E5E9F2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#15161c;display:flex;flex-wrap:wrap;gap:32px;padding:32px;align-items:flex-start}

.capa{position:relative;width:1080px;height:1920px;overflow:hidden;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;isolation:isolate;
  background:radial-gradient(circle 660px at 50% 47%,var(--e9-blue-600) 0%,var(--e9-blue-800) 52%,var(--e9-blue-950) 100%)}

/* malha blueprint: textura no grande, invisível no tamanho de exibição */
.capa::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);
  background-size:72px 72px;
  -webkit-mask-image:radial-gradient(circle at 50% 47%,#000 18%,transparent 46%);
          mask-image:radial-gradient(circle at 50% 47%,#000 18%,transparent 46%)}

/* área do ícone: 380px = ~35% do círculo visível (1080 de diâmetro) */
.ico{position:relative;z-index:2;width:430px;height:430px;margin-bottom:56px;
  filter:drop-shadow(0 10px 34px rgba(0,24,56,.5))}
.ico svg{display:block;width:100%;height:100%;
  fill:none;stroke:#F2F4FA;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}

/* a capa "sobre" usa a marca, que é preenchida e não traçada */
.ico.marca svg{fill:#F2F4FA;stroke:none}
.ico.marca{width:380px;height:380px}
</style>
</head>
