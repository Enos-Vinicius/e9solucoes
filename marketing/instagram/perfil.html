<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>E9 Soluções — foto de perfil</title>
<style>
/* =========================================================
   Foto de perfil · 1080x1080
   O Instagram recorta em círculo, então a marca fica contida
   no quadrado inscrito da circunferência (~76% da largura) e
   nada estrutural encosta nas bordas.
   ========================================================= */
:root{
  --e9-carbon:#06080F; --e9-midnight:#0A0E1A;
  --e9-platinum:#E5E9F2; --e9-indigo:#4F46E5; --e9-indigo-deep:#3730A3;
  --e9-indigo-light:#818CF8; --e9-cobalt:#2563EB; --e9-cobalt-light:#60A5FA;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#15161c;display:flex;flex-wrap:wrap;gap:40px;padding:40px;align-items:flex-start}

.avatar{position:relative;width:1080px;height:1080px;overflow:hidden;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;isolation:isolate}

/* malha blueprint discreta — some no tamanho de exibição, dá textura no grande */
.lattice{position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(129,140,248,.05) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(129,140,248,.05) 1px,transparent 1px);
  background-size:72px 72px;
  -webkit-mask-image:radial-gradient(circle at center,#000 25%,transparent 72%);
          mask-image:radial-gradient(circle at center,#000 25%,transparent 72%)}
.halo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  border-radius:50%;pointer-events:none}

/* a marca: caixa dentro da área segura do círculo */
.mark{position:relative;width:520px;height:520px;z-index:2}
.mark svg{display:block;width:100%;height:100%}

/* ---------- A · índigo sobre carbon ---------- */
#a{background:var(--e9-carbon)}
#a .halo{width:820px;height:820px;
  background:radial-gradient(circle,rgba(79,70,229,.42) 0%,rgba(6,8,15,0) 66%)}
#a .mark{filter:drop-shadow(0 0 58px rgba(79,70,229,.6))}

/* ---------- B · platina sobre índigo ---------- */
#b{background:radial-gradient(circle at 50% 34%,#4F46E5 0%,#3730A3 52%,#1E1B62 100%)}
#b .lattice{background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),
                             linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px)}
#b .mark{filter:drop-shadow(0 10px 34px rgba(6,8,15,.45))}

/* ---------- C · gradiente da marca sobre carbon ---------- */
#c{background:var(--e9-midnight)}
#c .halo{width:900px;height:900px;
  background:radial-gradient(circle,rgba(37,99,235,.34) 0%,rgba(10,14,26,0) 68%)}
#c .mark{filter:drop-shadow(0 0 52px rgba(96,165,250,.5))}
</style>
</head>
<body>

<!-- A · índigo sobre carbon — mais fiel ao site -->
<div class="avatar" id="a">
  <div class="halo"></div>
  <div class="lattice"></div>
  <div class="mark">
    <svg viewBox="4100 6700 12720 12700" role="img" aria-label="E9 Soluções">
      <use href="#e9-mark" fill="#818CF8"/>
    </svg>
  </div>
</div>

<!-- B · platina sobre índigo — maior contraste no feed -->
<div class="avatar" id="b">
  <div class="lattice"></div>
  <div class="mark">
    <svg viewBox="4100 6700 12720 12700" role="img" aria-label="E9 Soluções">
      <use href="#e9-mark" fill="#F2F4FA"/>
    </svg>
  </div>
</div>

<!-- C · marca com o gradiente da identidade -->
<div class="avatar" id="c">
  <div class="halo"></div>
  <div class="lattice"></div>
  <div class="mark">
    <svg viewBox="4100 6700 12720 12700" role="img" aria-label="E9 Soluções">
      <use href="#e9-mark" fill="url(#e9-grad)"/>
    </svg>
  </div>
</div>
